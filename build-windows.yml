name: Build MinhaDAW Studio (Windows x64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: MinhaDAW-Studio-Windows-x64
          path: build/MinhaDAW_artefacts/Release/MinhaDAW Studio.exe
          if-no-files-found: error
